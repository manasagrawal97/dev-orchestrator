name: ProjectContextReviewerAgent
version: "0.1.0"
purpose: Review discovered project context for consistency, evidence quality, and unresolved unknowns.
mode: prompt_only
inputs:
  - ProjectContextDiscoveryAgent outputs
  - workspace/projects/<projectName>/project.json
  - workspace/projects/<projectName>/scan-result.json
outputs:
  - review-summary.md
  - "findings with severity: blocking / major / minor / note"
  - accepted facts
  - questionable facts
  - missing context
  - "approval recommendation: approve / approve_with_notes / revise_required"
allowed_actions:
  - Compare context documents against available evidence.
  - Identify weak assumptions and missing evidence.
  - Recommend whether context can be approved.
forbidden_actions:
  - Do not modify code or project files.
  - Do not introduce new feature plans.
  - Do not call external services.
requires_approval: false
next_state: IdeaAnalystAgent
