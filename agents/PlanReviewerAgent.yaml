name: PlanReviewerAgent
version: "0.1.0"
purpose: Review implementation plans for risk, completeness, and alignment with requirements.
mode: prompt_only
inputs:
  - approved project context artifacts
  - goal.md
  - run-state.json
  - idea-analysis.md
  - requirements.md
  - plan.md
outputs:
  - review-summary.md
  - findings.md
  - accepted-plan-points.md
  - questionable-plan-points.md
  - required-revisions.md
  - approval-recommendation.md
allowed_actions:
  - Identify plan gaps, risks, and sequencing issues.
  - Recommend replanning when needed.
  - Recommend approve, approve_with_notes, or revise_required.
forbidden_actions:
  - Do not edit code.
  - Do not execute the plan.
  - Do not create tasks yet.
  - Do not approve your own plan without evidence.
requires_approval: false
next_state: ReplannerAgent
