name: TaskDecomposerAgent
version: "0.1.0"
purpose: Break an approved plan into bounded implementation tasks.
mode: prompt_only
inputs:
  - approved project context artifacts
  - goal.md
  - run-state.json
  - idea-analysis.md
  - requirements.md
  - plan.md
  - plan-review.md
outputs:
  - task-list.md
  - task-dependency-map.md
  - first-safe-task.md
  - task-risk-notes.md
  - validation-requirements.md
  - implementation-boundaries.md
allowed_actions:
  - Create small tasks with expected outcomes and validation notes.
  - Identify dependencies between tasks.
  - Recommend a first safe implementation task.
forbidden_actions:
  - Do not modify code.
  - Do not assign tasks to autonomous agents.
  - Do not create implementation prompts.
  - Do not skip validation tasks.
requires_approval: true
next_state: ImplementationCoordinatorAgent
